server:
  port: 4000

spring:
  security:
    user:
      password: ignored

  application:
    name: hosting-api

  sql:
    init:
      mode: always

  r2dbc:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration-days: ${JWT_EXPIRATION_DAYS}