syntax = "proto3";

package vm_manager;

service VMManager {
  rpc PickNode (PickNodeRequest) returns (NodeInfo);
  rpc CreateVM (CreateVMRequest) returns (VMResponse);
  rpc DeleteVM (VMRequest)       returns (VMResponse);
  rpc StartVM  (VMRequest)       returns (VMResponse);
  rpc StopVM   (VMRequest)       returns (VMResponse);
  rpc GetVM    (VMRequest)       returns (VMResponse);
}

message NodeInfo {
  int64  node_id   = 1;
  string ip        = 2;
  int32  grpc_port = 3;
}

message PickNodeRequest {
  repeated NodeInfo nodes = 1;
}

message CreateVMRequest {
  string   vm_name        = 1;
  int32    ram_mb         = 2;
  int32    vcpus          = 3;
  int32    disk_gb        = 4;
  string   base_image     = 5;
  NodeInfo node           = 6;
  string ip_address       = 7;
  string vm_password      = 8;
  optional string ssh_key = 9;
}

message VMRequest {
  string   uuid = 1;
  NodeInfo node = 2;
}

message VMResponse {
  string   vm_name    = 1;
  string   uuid       = 2;
  string   ip_address = 3;
  string   mac        = 4;
  string   status     = 5;
  NodeInfo node       = 6;
}